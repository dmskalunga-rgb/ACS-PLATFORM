name: Phase 1 platform multi-tenancy validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0

jobs:
  selective-adoption-lineage:
    name: Original lineage preservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify original commits and preservation evidence
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            043619e3712f15f1dd0e2b38085c63fcb5a48035
            ac13953715134c1e37f862a1af9b5205f58083a7
            683bccbaf09ea10a89399691449475e9916dfc79
          )
          for commit in "${commits[@]}"; do
            git cat-file -e "${commit}^{commit}"
            grep -q "$commit" docs/evidence/phase-1/original-three-commit-lineage.md
          done

  phase-one-quality:
    name: Phase 1 quality and production guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Prove development identity is absent from production output
        shell: bash
        env:
          VITE_DEV_IDENTITY_SUBJECT: phase1-production-guard-sentinel
          VITE_TENANT_ID: 00000000-0000-4000-8000-000000000011
        run: |
          set -euo pipefail
          pnpm --filter @acs/web build
          if grep -R -F 'phase1-production-guard-sentinel' apps/web/dist; then
            echo 'Development identity leaked into the production bundle.'
            exit 1
          fi

  phase-one-database-e2e:
    name: PostgreSQL trusted context, RLS, audit, and API E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: acs_foundation
          POSTGRES_PASSWORD: acs_ci_ephemeral
          POSTGRES_USER: acs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acs -d acs_foundation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACS_ENV: test
      DATABASE_URL: postgresql://acs:acs_ci_ephemeral@localhost:5432/acs_foundation
      ACS_CONTEXT_RESOLVER_DATABASE_URL: postgresql://acs_phase1_issuer_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
      ACS_TENANT_DATABASE_URL: postgresql://acs_phase1_tenant_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
      ACS_TENANT_ADMIN_DATABASE_URL: postgresql://acs_phase1_admin_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
      ACS_SECURITY_AUDIT_DATABASE_URL: postgresql://acs_phase1_auditor_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
      ACS_EVENT_PUBLISHER_DATABASE_URL: postgresql://acs_event_publisher_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
      ACS_EVENT_CONSUMER_DATABASE_URL: postgresql://acs_event_consumer_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
      ACS_EVENT_OPERATOR_DATABASE_URL: postgresql://acs_event_operator_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
      ACS_EVENT_RETENTION_DATABASE_URL: postgresql://acs_event_retention_login_test:acs_phase1_test_only@localhost:5432/acs_foundation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm --filter @acs/platform-api... build
      - run: pnpm test:phase1:e2e
      - run: pnpm test:event-foundation:e2e
