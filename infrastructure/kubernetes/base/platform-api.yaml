apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: acs-foundation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: acs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: acs/platform-api:0.0.0-foundation
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-api-config
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /live
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: acs-foundation
spec:
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 3000
      targetPort: http
