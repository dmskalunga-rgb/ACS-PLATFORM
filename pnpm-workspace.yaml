packages:
  - apps/*
  - services/*
  - packages/*

overrides:
  '@fastify/ajv-compiler>fast-uri': 3.1.6
  'ajv>fast-uri': 3.1.6
  'json-schema-resolver>fast-uri': 3.1.6
  'fast-json-stringify>fast-uri': 4.1.3

catalogMode: strict

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAgeExclude:
  - fastify@5.11.3
  - pg-protocol@1.16.0
  - pg@8.23.0

allowBuilds:
  esbuild: true
  protobufjs: true

catalog:
  jose: 6.2.8
  oidc-client-ts: 3.5.0
